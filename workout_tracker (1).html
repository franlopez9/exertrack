<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitTracker - Plan de Entrenamiento</title>
<style>
:root {
  --bg-gradient: linear-gradient(135deg, #f1f7ed 0%, #e5eee2 100%);
  --panel-bg: rgba(255, 255, 255, 0.7);
  --panel-solid: #ffffff;
  --panel-border: rgba(255, 255, 255, 0.85);
  --text-main: #1c2518;
  --text-muted: #677561;
  --accent: #2e7d32;
  --accent-light: #4caf50;
  --accent-dark: #1b5e20;
  --accent-glow: rgba(46, 125, 50, 0.25);
  --glass-shadow: 0 10px 30px -5px rgba(45, 80, 35, 0.08), 0 0 1px rgba(0, 0, 0, 0.05);
  --glass-blur: blur(20px) saturate(180%);
}

[data-theme="dark"] {
  --bg-gradient: linear-gradient(135deg, #0d120c 0%, #151c13 100%);
  --panel-bg: rgba(26, 34, 24, 0.7);
  --panel-solid: #1e261c;
  --panel-border: rgba(255, 255, 255, 0.08);
  --text-main: #eef4ec;
  --text-muted: #8d9b87;
  --accent: #4caf50;
  --accent-light: #81c784;
  --accent-dark: #2e7d32;
  --accent-glow: rgba(76, 175, 80, 0.35);
  --glass-shadow: 0 14px 40px -5px rgba(0, 0, 0, 0.5);
  --glass-blur: blur(25px) saturate(190%);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  min-height: 100vh;
  padding-bottom: 60px;
  transition: background 0.4s ease, color 0.4s ease;
}

button, input, select, textarea {
  font: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
}

.app {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 16px;
}

/* HEADER GLASS */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
  padding: 14px 22px;
  background: var(--panel-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--panel-border);
  border-radius: 22px;
  box-shadow: var(--glass-shadow);
}

.logo {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text-main);
}

.logo span {
  color: var(--accent);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
  color: #ffffff;
  padding: 10px 18px;
  border-radius: 14px;
  font-weight: 700;
  font-size: 14px;
  box-shadow: 0 4px 14px var(--accent-glow);
  transition: transform 0.15s, opacity 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-primary:active {
  transform: scale(0.96);
}

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: rgba(125, 125, 125, 0.08);
  color: var(--text-main);
  display: grid;
  place-items: center;
  font-size: 16px;
  transition: background 0.2s;
}

.icon-btn:hover {
  background: rgba(125, 125, 125, 0.16);
}

/* LAYOUT */
.layout {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 24px;
}

/* SIDEBAR GLASS */
.sidebar {
  background: var(--panel-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--panel-border);
  border-radius: 24px;
  padding: 16px;
  height: max-content;
  position: sticky;
  top: 24px;
  box-shadow: var(--glass-shadow);
}

.nav-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
  margin: 12px 12px 6px;
}

.nav {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 11px 14px;
  border-radius: 14px;
  color: var(--text-muted);
  font-weight: 600;
  font-size: 14px;
  transition: all 0.2s;
  margin-bottom: 4px;
}

.nav.active, .nav:hover {
  background: var(--accent);
  color: #ffffff;
  box-shadow: 0 4px 14px var(--accent-glow);
}

.nav svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
}

/* STATS */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 24px;
}

.stat {
  padding: 18px 16px;
  background: var(--panel-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--panel-border);
  border-radius: 20px;
  box-shadow: var(--glass-shadow);
}

.stat b {
  font-size: 26px;
  font-weight: 800;
  display: block;
  letter-spacing: -0.5px;
}

.stat span {
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 600;
}

/* TIMER WIDGET GLASS */
.timer-widget {
  background: var(--panel-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--panel-border);
  border-radius: 24px;
  padding: 20px 24px;
  box-shadow: var(--glass-shadow);
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}

.timer-display {
  display: flex;
  align-items: center;
  gap: 16px;
}

.timer-clock {
  font-size: 38px;
  font-weight: 800;
  font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
  letter-spacing: -1px;
  color: var(--accent);
}

.timer-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.timer-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.btn-pill {
  padding: 8px 14px;
  border-radius: 99px;
  background: rgba(125, 125, 125, 0.12);
  color: var(--text-main);
  font-weight: 700;
  font-size: 13px;
  transition: all 0.2s;
}

.btn-pill:hover, .btn-pill.active {
  background: var(--accent);
  color: #ffffff;
}

/* CATEGORY SCROLL PILLS */
.genre-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 12px;
  margin-bottom: 16px;
  scrollbar-width: none;
}

.genre-scroll::-webkit-scrollbar {
  display: none;
}

.genre-pill {
  padding: 8px 16px;
  border-radius: 99px;
  background: var(--panel-bg);
  backdrop-filter: var(--glass-blur);
  border: 1px solid var(--panel-border);
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  transition: all 0.2s;
}

.genre-pill:hover, .genre-pill.active {
  background: var(--accent);
  color: #ffffff;
  border-color: var(--accent);
  box-shadow: 0 4px 12px var(--accent-glow);
}

/* EXERCISE CARDS GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.card {
  background: var(--panel-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--panel-border);
  border-radius: 22px;
  padding: 20px;
  box-shadow: var(--glass-shadow);
  transition: transform 0.2s ease, border-color 0.2s ease;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.card:hover {
  transform: translateY(-3px);
  border-color: var(--accent);
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 10px;
}

.card-tag {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 99px;
  background: var(--accent-glow);
  color: var(--accent-dark);
}

[data-theme="dark"] .card-tag {
  color: var(--accent-light);
}

.card-title {
  font-size: 17px;
  font-weight: 800;
  margin: 6px 0 4px;
}

.card-desc {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.4;
  margin-bottom: 14px;
}

.card-specs {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
}

.spec-box {
  background: rgba(125, 125, 125, 0.08);
  padding: 8px 12px;
  border-radius: 12px;
  flex: 1;
  text-align: center;
}

.spec-box small {
  display: block;
  font-size: 10px;
  color: var(--text-muted);
  font-weight: 700;
  text-transform: uppercase;
}

.spec-box b {
  font-size: 14px;
}

.card-actions {
  display: flex;
  gap: 8px;
}

.btn-sec {
  background: rgba(125, 125, 125, 0.12);
  color: var(--text-main);
  padding: 9px 14px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 13px;
  flex: 1;
  text-align: center;
  transition: background 0.2s;
}

.btn-sec:hover {
  background: rgba(125, 125, 125, 0.2);
}

.btn-danger {
  background: rgba(239, 68, 68, 0.12);
  color: #ef4444;
  padding: 9px 14px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 13px;
}

.btn-danger:hover {
  background: rgba(239, 68, 68, 0.22);
}

/* MODALS GLASS */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
}

.modal.show {
  display: flex;
}

.dialog {
  max-width: 580px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  background: var(--panel-solid);
  border: 1px solid var(--panel-border);
  border-radius: 26px;
  padding: 28px;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
  position: relative;
}

.close-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(125, 125, 125, 0.12);
  color: var(--text-main);
  display: grid;
  place-items: center;
  font-weight: 700;
}

.field {
  margin-top: 14px;
}

.field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.field input, .field select, .field textarea {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid rgba(125, 125, 125, 0.2);
  background: rgba(125, 125, 125, 0.06);
  color: var(--text-main);
  outline: none;
}

.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--accent);
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 24px;
}

/* WORKOUT MODE MODAL */
.workout-tracker-box {
  text-align: center;
  padding: 10px 0;
}

.workout-timer-huge {
  font-size: 54px;
  font-weight: 900;
  font-family: SFMono-Regular, Consolas, monospace;
  color: var(--accent);
  margin: 10px 0;
}

.set-tracker {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 20px 0;
}

.set-check {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  border: 2px solid var(--accent);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--accent);
}

.set-check.done {
  background: var(--accent);
  color: #ffffff;
  box-shadow: 0 4px 12px var(--accent-glow);
}

.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--text-main);
  color: var(--panel-solid);
  padding: 12px 20px;
  border-radius: 14px;
  font-weight: 600;
  font-size: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  display: none;
  z-index: 200;
}

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
  background: var(--panel-bg);
  backdrop-filter: var(--glass-blur);
  border: 1px dashed var(--panel-border);
  border-radius: 22px;
  font-weight: 500;
}

@media (max-width: 850px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: static; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .timer-widget { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="logo">Fit<span>Tracker</span></div>
    <div class="header-right">
      <button class="btn-primary" onclick="openAddExercise()">+ Agregar Ejercicio</button>
      <button class="icon-btn" title="Modo Claro/Oscuro" onclick="toggleTheme()" id="themeBtn">☾</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="nav-title">Plan de 4 Semanas</div>
      <button class="nav active" data-week="1">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> Semana 1: Adaptación
      </button>
      <button class="nav" data-week="2">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> Semana 2: Consistencia
      </button>
      <button class="nav" data-week="3">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> Semana 3: Intensidad
      </button>
      <button class="nav" data-week="4">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> Semana 4: Hábitos
      </button>

      <div class="nav-title" style="margin-top:20px;">Filtros</div>
      <button class="nav" data-week="all">
        <svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg> Ver Todos
      </button>
    </aside>

    <main>
      <!-- STATS BAR -->
      <section class="stats">
        <div class="stat"><b id="statTotal">0</b><span>Ejercicios</span></div>
        <div class="stat"><b id="statWeek">Semana 1</b><span>Semana Activa</span></div>
        <div class="stat"><b id="statSessions">0</b><span>Sesiones Hechas</span></div>
        <div class="stat"><b id="statTime">0m</b><span>Tiempo Entrenado</span></div>
      </section>

      <!-- REST TIMER WIDGET -->
      <div class="timer-widget">
        <div class="timer-display">
          <div>
            <div class="timer-label">Temporizador de Descanso</div>
            <div class="timer-clock" id="timerClock">00:45</div>
          </div>
        </div>
        <div class="timer-controls">
          <button class="btn-pill" onclick="setTimer(30)">30s</button>
          <button class="btn-pill" onclick="setTimer(45)">45s</button>
          <button class="btn-pill" onclick="setTimer(60)">60s</button>
          <button class="btn-pill" onclick="setTimer(90)">90s</button>
          <button class="btn-primary" id="timerToggleBtn" onclick="toggleTimer()">Iniciar</button>
          <button class="btn-pill" onclick="resetTimer()">Reset</button>
        </div>
      </div>

      <!-- CATEGORY PILLS -->
      <div class="genre-scroll" id="categoryPills"></div>

      <!-- EXERCISES GRID -->
      <div class="grid" id="exerciseGrid"></div>
    </main>
  </div>
</div>

<!-- MODAL: ADD / EDIT EXERCISE -->
<div class="modal" id="exerciseModal">
  <div class="dialog">
    <button class="close-btn" onclick="closeExerciseModal()">✕</button>
    <h2 id="modalTitle">Nuevo Ejercicio</h2>
    
    <div class="field">
      <label>Nombre del Ejercicio</label>
      <input id="inputName" type="text" placeholder="Ej: Flexiones inclinadas...">
    </div>

    <div class="form-grid">
      <div class="field">
        <label>Categoría / Zona</label>
        <select id="inputCategory">
          <option value="Postura">Postura / Columna</option>
          <option value="Pecho / Ginecomastia">Pecho / Ginecomastia</option>
          <option value="Espalda">Espalda Alta / Baja</option>
          <option value="Cuello / Papada">Cuello / Papada</option>
          <option value="Core / Cardio">Core / Cardio</option>
        </select>
      </div>

      <div class="field">
        <label>Semana del Plan</label>
        <select id="inputWeek">
          <option value="1">Semana 1</option>
          <option value="2">Semana 2</option>
          <option value="3">Semana 3</option>
          <option value="4">Semana 4</option>
        </select>
      </div>
    </div>

    <div class="form-grid">
      <div class="field">
        <label>Series (Sets)</label>
        <input id="inputSets" type="number" min="1" value="3">
      </div>
      <div class="field">
        <label>Repeticiones / Tiempo</label>
        <input id="inputReps" type="text" placeholder="Ej: 12 reps o 45 seg">
      </div>
    </div>

    <div class="field">
      <label>Descanso Recomendado (segundos)</label>
      <input id="inputRest" type="number" min="10" value="45">
    </div>

    <div class="field">
      <label>Instrucciones / Notas</label>
      <textarea id="inputNotes" rows="2" placeholder="Mantener la espalda recta..."></textarea>
    </div>

    <div class="actions">
      <button class="btn-sec" style="flex:1" onclick="closeExerciseModal()">Cancelar</button>
      <button class="btn-primary" style="flex:1" onclick="saveExercise()">Guardar Ejercicio</button>
    </div>
  </div>
</div>

<!-- MODAL: LIVE WORKOUT MODE -->
<div class="modal" id="workoutModal">
  <div class="dialog">
    <button class="close-btn" onclick="closeWorkoutModal()">✕</button>
    <div class="workout-tracker-box">
      <div class="card-tag" id="wCategory">Postura</div>
      <h2 id="wTitle" style="margin:12px 0 4px;">Nombre Ejercicio</h2>
      <p id="wNotes" style="color:var(--text-muted); font-size:14px;">Notas e instrucciones...</p>

      <div class="workout-timer-huge" id="stopwatchDisplay">00:00</div>
      <div style="font-size:12px; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Tiempo en este Ejercicio</div>

      <div class="set-tracker" id="setTracker"></div>

      <div class="actions" style="justify-content:center;">
        <button class="btn-sec" onclick="triggerRestTimer()">Rest Timer (<span id="wRestVal">45</span>s)</button>
        <button class="btn-primary" onclick="finishExerciseSession()">Completar Ejercicio</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* INITIAL DEFAULT EXERCISES BASED ON 4-WEEK PROGRAM */
const DEFAULT_EXERCISES = [
  // SEMANA 1
  { id: 1, name: "Gato-Vaca", category: "Postura", week: "1", sets: 2, reps: "10 Lentas", rest: 30, notes: "Movilidad de columna. Respira profundo al arquear y flexionar." },
  { id: 2, name: "Puente de Glúteos", category: "Postura", week: "1", sets: 2, reps: "12 reps", rest: 45, notes: "Activa glúteos y protege la zona lumbar baja." },
  { id: 3, name: "Flexiones Inclinadas", category: "Pecho / Ginecomastia", week: "1", sets: 3, reps: "8 reps", rest: 60, notes: "Realizar sobre mesa alta o pared firme para adaptar el pectoral." },
  { id: 4, name: "Beso al Cielo + Elevación de Barbilla", category: "Cuello / Papada", week: "1", sets: 2, reps: "10 reps", rest: 30, notes: "Estira la cadena anterior del cuello y tonifica zona submentoniana." },

  // SEMANA 2
  { id: 5, name: "Bird-Dog (Perro-Pájaro)", category: "Espalda", week: "2", sets: 3, reps: "8 por lado", rest: 45, notes: "Mantén el abdomen firme sin balancear la cadera." },
  { id: 6, name: "Puente de Glúteos con Pausa", category: "Postura", week: "2", sets: 3, reps: "15 reps", rest: 45, notes: "Aprieta glúteos 1 segundo en el punto más alto." },
  { id: 7, name: "Flexiones Inclinadas Medias", category: "Pecho / Ginecomastia", week: "2", sets: 3, reps: "10 reps", rest: 60, notes: "Mantén el cuerpo en línea recta desde los talones a la cabeza." },

  // SEMANA 3
  { id: 8, name: "Bird-Dog Isométrico", category: "Espalda", week: "3", sets: 3, reps: "10 por lado (2s pausa)", rest: 45, notes: "Pausa 2 segundos arriba en cada repetición." },
  { id: 9, name: "Flexiones Inclinadas Bajas", category: "Pecho / Ginecomastia", week: "3", sets: 3, reps: "12 reps", rest: 60, notes: "Busca una superficie ligeramente más baja para aumentar resistencia." },

  // SEMANA 4
  { id: 10, name: "Súperserie: Puente + Bird-Dog", category: "Core / Cardio", week: "4", sets: 3, reps: "12 + 10 reps", rest: 60, notes: "Realiza ambos ejercicios seguidos sin descanso intermedio." },
  { id: 11, name: "Flexiones Controladas (Tempo 2-1)", category: "Pecho / Ginecomastia", week: "4", sets: 3, reps: "12-15 reps", rest: 60, notes: "Baja en 2 segundos, sube en 1 segundo con máximo control." }
];

/* LOCAL STORAGE DATA */
let exercises = JSON.parse(localStorage.getItem("fit_exercises") || JSON.stringify(DEFAULT_EXERCISES));
let historyLog = JSON.parse(localStorage.getItem("fit_history") || "[]");

let currentWeek = "1";
let currentCategory = "ALL";
let editingId = null;

/* TIMERS LOGIC */
let timerSeconds = 45;
let timerMax = 45;
let timerInterval = null;
let isTimerRunning = false;

let stopwatchSeconds = 0;
let stopwatchInterval = null;
let activeExercise = null;
let completedSets = [];

function save() {
  localStorage.setItem("fit_exercises", JSON.stringify(exercises));
  localStorage.setItem("fit_history", JSON.stringify(historyLog));
  render();
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => el.style.display = "none", 2200);
}

/* RENDER MAIN INTERFACE */
function render() {
  let filtered = currentWeek === "all" ? exercises : exercises.filter(e => e.week === currentWeek);
  if (currentCategory !== "ALL") {
    filtered = filtered.filter(e => e.category === currentCategory);
  }

  // Stats
  document.getElementById("statTotal").textContent = exercises.length;
  document.getElementById("statWeek").textContent = currentWeek === "all" ? "Todas" : `Semana ${currentWeek}`;
  document.getElementById("statSessions").textContent = historyLog.length;
  
  const totalMins = Math.round(historyLog.reduce((acc, curr) => acc + (curr.duration || 0), 0) / 60);
  document.getElementById("statTime").textContent = `${totalMins}m`;

  renderCategories();

  const grid = document.getElementById("exerciseGrid");
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty">No hay ejercicios agregados en esta categoría o semana.</div>`;
    return;
  }

  grid.innerHTML = filtered.map(ex => `
    <div class="card">
      <div>
        <div class="card-header">
          <span class="card-tag">${esc(ex.category)}</span>
          <span style="font-size:11px; font-weight:700; color:var(--text-muted);">Semana ${ex.week}</span>
        </div>
        <div class="card-title">${esc(ex.name)}</div>
        <div class="card-desc">${esc(ex.notes || "Sin instrucciones específicas.")}</div>
      </div>
      <div>
        <div class="card-specs">
          <div class="spec-box"><small>Series</small><b>${ex.sets}</b></div>
          <div class="spec-box"><small>Reps / T</small><b>${esc(ex.reps)}</b></div>
          <div class="spec-box"><small>Descanso</small><b>${ex.rest}s</b></div>
        </div>
        <div class="card-actions">
          <button class="btn-primary" style="flex:2" onclick="startWorkoutMode(${ex.id})">▶ Entrenar</button>
          <button class="btn-sec" onclick="openEditExercise(${ex.id})">✎</button>
          <button class="btn-danger" onclick="deleteExercise(${ex.id})">✕</button>
        </div>
      </div>
    </div>
  `).join("");
}

function renderCategories() {
  const cats = ["ALL", ...Array.from(new Set(exercises.map(e => e.category)))];
  const container = document.getElementById("categoryPills");
  container.innerHTML = cats.map(c => `
    <button class="genre-pill ${currentCategory === c ? 'active' : ''}" onclick="setCategory('${c}')">
      ${c === 'ALL' ? 'Todas las Zonas' : esc(c)}
    </button>
  `).join("");
}

function setCategory(cat) {
  currentCategory = cat;
  render();
}

/* TIMER FUNCTIONALITY */
function setTimer(sec) {
  clearInterval(timerInterval);
  isTimerRunning = false;
  timerSeconds = sec;
  timerMax = sec;
  updateTimerDisplay();
  document.getElementById("timerToggleBtn").textContent = "Iniciar";
}

function toggleTimer() {
  if (isTimerRunning) {
    clearInterval(timerInterval);
    isTimerRunning = false;
    document.getElementById("timerToggleBtn").textContent = "Reanudar";
  } else {
    isTimerRunning = true;
    document.getElementById("timerToggleBtn").textContent = "Pausa";
    timerInterval = setInterval(() => {
      timerSeconds--;
      updateTimerDisplay();
      if (timerSeconds <= 0) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        document.getElementById("timerToggleBtn").textContent = "Iniciar";
        playBeep();
        toast("¡Tiempo de descanso terminado! A entrenar 💪");
      }
    }, 1000);
  }
}

function resetTimer() {
  setTimer(timerMax);
}

function updateTimerDisplay() {
  const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
  const s = String(timerSeconds % 60).padStart(2, '0');
  document.getElementById("timerClock").textContent = `${m}:${s}`;
}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
  } catch(e) {}
}

/* ADD / EDIT EXERCISE MODAL */
function openAddExercise() {
  editingId = null;
  document.getElementById("modalTitle").textContent = "Nuevo Ejercicio";
  document.getElementById("inputName").value = "";
  document.getElementById("inputCategory").value = "Postura";
  document.getElementById("inputWeek").value = currentWeek === "all" ? "1" : currentWeek;
  document.getElementById("inputSets").value = "3";
  document.getElementById("inputReps").value = "12 reps";
  document.getElementById("inputRest").value = "45";
  document.getElementById("inputNotes").value = "";
  document.getElementById("exerciseModal").classList.add("show");
}

function openEditExercise(id) {
  const ex = exercises.find(e => e.id === id);
  if (!ex) return;
  editingId = id;
  document.getElementById("modalTitle").textContent = "Editar Ejercicio";
  document.getElementById("inputName").value = ex.name;
  document.getElementById("inputCategory").value = ex.category;
  document.getElementById("inputWeek").value = ex.week;
  document.getElementById("inputSets").value = ex.sets;
  document.getElementById("inputReps").value = ex.reps;
  document.getElementById("inputRest").value = ex.rest;
  document.getElementById("inputNotes").value = ex.notes || "";
  document.getElementById("exerciseModal").classList.add("show");
}

function closeExerciseModal() {
  document.getElementById("exerciseModal").classList.remove("show");
}

function saveExercise() {
  const name = document.getElementById("inputName").value.trim();
  if (!name) return toast("Por favor ingresa un nombre.");

  const item = {
    id: editingId || Date.now(),
    name: name,
    category: document.getElementById("inputCategory").value,
    week: document.getElementById("inputWeek").value,
    sets: Number(document.getElementById("inputSets").value) || 1,
    reps: document.getElementById("inputReps").value || "10 reps",
    rest: Number(document.getElementById("inputRest").value) || 30,
    notes: document.getElementById("inputNotes").value || ""
  };

  if (editingId) {
    const idx = exercises.findIndex(e => e.id === editingId);
    if (idx > -1) exercises[idx] = item;
  } else {
    exercises.push(item);
  }

  save();
  closeExerciseModal();
  toast(editingId ? "Ejercicio actualizado" : "Ejercicio guardado");
}

function deleteExercise(id) {
  exercises = exercises.filter(e => e.id !== id);
  save();
  toast("Ejercicio eliminado");
}

/* LIVE WORKOUT TRACKER MODE */
function startWorkoutMode(id) {
  const ex = exercises.find(e => e.id === id);
  if (!ex) return;
  activeExercise = ex;
  completedSets = new Array(ex.sets).fill(false);

  document.getElementById("wCategory").textContent = ex.category;
  document.getElementById("wTitle").textContent = ex.name;
  document.getElementById("wNotes").textContent = ex.notes || "Sigue la técnica recomendada.";
  document.getElementById("wRestVal").textContent = ex.rest;

  renderSetTracker();

  // Reset Stopwatch
  stopwatchSeconds = 0;
  clearInterval(stopwatchInterval);
  updateStopwatchDisplay();
  stopwatchInterval = setInterval(() => {
    stopwatchSeconds++;
    updateStopwatchDisplay();
  }, 1000);

  document.getElementById("workoutModal").classList.add("show");
}

function renderSetTracker() {
  const container = document.getElementById("setTracker");
  container.innerHTML = completedSets.map((done, i) => `
    <div class="set-check ${done ? 'done' : ''}" onclick="toggleSet(${i})">
      ${done ? '✓' : i + 1}
    </div>
  `).join("");
}

function toggleSet(i) {
  completedSets[i] = !completedSets[i];
  renderSetTracker();
  if (completedSets[i]) {
    triggerRestTimer();
  }
}

function triggerRestTimer() {
  if (activeExercise) {
    setTimer(activeExercise.rest);
    toggleTimer();
  }
}

function updateStopwatchDisplay() {
  const m = String(Math.floor(stopwatchSeconds / 60)).padStart(2, '0');
  const s = String(stopwatchSeconds % 60).padStart(2, '0');
  document.getElementById("stopwatchDisplay").textContent = `${m}:${s}`;
}

function finishExerciseSession() {
  clearInterval(stopwatchInterval);
  historyLog.push({
    exerciseId: activeExercise.id,
    date: new Date().toISOString(),
    duration: stopwatchSeconds,
    setsCompleted: completedSets.filter(Boolean).length
  });
  save();
  closeWorkoutModal();
  toast("¡Gran trabajo! Sesión registrada 🔥");
}

function closeWorkoutModal() {
  clearInterval(stopwatchInterval);
  document.getElementById("workoutModal").classList.remove("show");
}

/* THEME TOGGLE */
function toggleTheme() {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  localStorage.setItem("fit_theme", dark ? "light" : "dark");
  document.getElementById("themeBtn").textContent = dark ? "☾" : "☀";
}

function esc(text = "") {
  return String(text).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[c]));
}

/* NAV FILTERS */
document.querySelectorAll(".nav").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".nav").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentWeek = btn.dataset.week;
    render();
  };
});

window.onclick = e => {
  if (e.target === document.getElementById("exerciseModal")) closeExerciseModal();
  if (e.target === document.getElementById("workoutModal")) closeWorkoutModal();
};

/* INITIAL LOAD */
const savedTheme = localStorage.getItem("fit_theme") || "light";
document.documentElement.setAttribute("data-theme", savedTheme);
document.getElementById("themeBtn").textContent = savedTheme === "dark" ? "☀" : "☾";

render();
</script>
</body>
</html>
